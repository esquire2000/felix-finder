<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felix Finder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#e4f1e6; --panel:#ffffff; --ink:#132a18; --muted:#3f6648; --line:#bcd6c1;
  --accent:#009c25; --accent-ink:#ffffff; --brand:#009c25; --on-zone:#ffffff;
  --cold:#007a38; --cold-soft:#d2ecdb; --amb:#3d870e; --amb-soft:#e2f1cc; --wait-soft:#d9e7dc;
  --warn:#b3261e;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1a10; --panel:#152619; --ink:#e6f2e8; --muted:#97b59e; --line:#294230;
  --accent:#2fbf4f; --accent-ink:#0b140d; --brand:#009c25; --on-zone:#0b140d;
  --cold:#45c27a; --cold-soft:#11301c; --amb:#9acb55; --amb-soft:#233117; --wait-soft:#1d2e21;
  --warn:#ff8a80; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:20px}
.brand{background:var(--brand);color:#fff}
.brand-in{max-width:640px;margin:0 auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.brand img{display:block;width:100%;max-width:300px;height:auto}
.brand-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-top:1px solid rgba(255,255,255,.35);padding-top:10px}
h1{font-family:var(--f-display);font-weight:700;font-size:2rem;line-height:1;margin:0;text-transform:uppercase}
.brand p{margin:2px 0 0;font-size:.9rem;opacity:.9}
.brand .me{margin-left:auto;text-align:right;font-size:.85rem;opacity:.9;white-space:nowrap;flex:none}
.brand .link{color:#fff}
h2{font-family:var(--f-display);font-weight:600;font-size:1.05rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.lbl{display:block;font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=password]{width:100%;font-family:var(--f-code);font-weight:700;font-size:1.5rem;text-transform:uppercase;letter-spacing:.04em;padding:12px 14px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input.plain{font-family:var(--f-body);font-weight:400;font-size:1.05rem;text-transform:none;letter-spacing:0}
input:focus{outline:none;border-color:var(--accent)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg2{grid-template-columns:repeat(2,1fr)}
.opt{min-height:56px;border:2px solid var(--line);border-radius:8px;background:var(--panel);font-family:var(--f-display);font-weight:600;font-size:1.05rem;text-transform:uppercase;padding:6px;white-space:nowrap}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.opt.c[aria-pressed=true]{background:var(--cold);border-color:var(--cold);color:var(--on-zone)}
.opt.a[aria-pressed=true]{background:var(--amb);border-color:var(--amb);color:var(--on-zone)}
.bays{display:grid;grid-template-columns:auto repeat(5,1fr);gap:6px;align-items:center}
.rh{font-family:var(--f-display);font-weight:600;font-size:.95rem;color:var(--muted);padding-right:4px;white-space:nowrap}
.ch{text-align:center;font-size:.75rem;color:var(--muted);font-weight:600}
.bay{min-height:48px;border:2px solid var(--line);border-radius:6px;background:var(--panel);font-family:var(--f-code);font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums}
.bay[aria-pressed=true]{background:var(--amb);border-color:var(--amb);color:var(--on-zone)}
.stack{display:flex;flex-direction:column;gap:14px}
.primary{min-height:56px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700;font-size:1.3rem;text-transform:uppercase;width:100%}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{min-height:44px;border:2px solid var(--line);border-radius:8px;background:transparent;padding:0 14px;font-weight:600}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:.85rem}
.danger{color:var(--warn)}
.found{display:flex;flex-direction:column;gap:12px}
.where{display:flex;gap:12px}
.where .tag{flex:none;width:10px;border-radius:4px}
.where .big{font-family:var(--f-display);font-weight:700;font-size:2.2rem;line-height:1.05;text-transform:uppercase}
.sub{color:var(--muted);font-size:.92rem}
.code{font-family:var(--f-code);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.msg{font-size:.95rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:8px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.map{display:flex;flex-direction:column;gap:10px}
.zone{display:flex;justify-content:space-between;align-items:center;border-radius:8px;padding:12px 14px;border:0;width:100%;text-align:left}
.zone.c{background:var(--cold);color:var(--on-zone)} .zone.a{background:var(--amb);color:var(--on-zone)} .zone.w{background:var(--wait-soft)}
.zone.sel{outline:3px solid var(--ink);outline-offset:1px}
.zone b{font-family:var(--f-display);font-size:1.2rem;text-transform:uppercase}
.zone .n{font-family:var(--f-code);font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums}
.zone.c .n,.zone.a .n{color:inherit}
.zone{flex-wrap:wrap}
.codes{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.codes:empty{display:none}
.chip{font-family:var(--f-code);font-weight:700;font-size:.8rem;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:2px 6px;color:var(--ink)}
.chip.more{font-family:var(--f-body);font-weight:600;color:var(--muted)}
.mapbays .bay{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:2px;padding:4px 3px;min-height:60px;min-width:0;text-align:center}
.mapbays .bay small{font-family:var(--f-body);font-weight:600;font-size:.66rem;color:var(--muted)}
.mapbays .bay .bc{font-family:var(--f-code);font-weight:700;font-size:.66rem;line-height:1.3;overflow-wrap:anywhere;color:var(--ink)}
.mapbays .bay .bm{font-size:.62rem;font-weight:600;color:var(--muted)}
.mapbays .bay.has{background:var(--amb-soft);border-color:var(--amb)}
.mapbays .bay.sel{outline:3px solid var(--ink);outline-offset:1px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.list li:first-child{border-top:0}
.list .mv{min-width:0}
.meta{color:var(--muted);font-size:.85rem;text-align:right;white-space:nowrap}
.kind{display:inline-block;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:6px;color:var(--muted);vertical-align:2px}
.empty{color:var(--muted);font-size:.95rem;margin:0}
.err{color:var(--warn);font-size:.95rem;margin:0}
</style>
</head>

    <section class="panel stack">
      <div>
        <label class="lbl" for="code">Dolly or pallet code</label>
        <input type="text" id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. EHBG">
      </div>
      <div id="result" class="msg">Type a code to see where it is.</div>
    </section>

    <section class="panel stack" id="formPanel" hidden>
      <h2 id="formh">Place it</h2>
      <div>
        <span class="lbl">What is it?</span>
        <div class="seg seg2" id="kindSeg">
          <button class="opt" data-kind="Dolly" aria-pressed="true">Dolly</button>
          <button class="opt" data-kind="Pallet" aria-pressed="false">Pallet</button>
        </div>
      </div>
      <div>
        <span class="lbl">Where is it now?</span>
        <div class="seg" id="locSeg">
          <button class="opt c" data-loc="Chiller 1" aria-pressed="false">Chiller 1</button>
          <button class="opt c" data-loc="Chiller 2" aria-pressed="false">Chiller 2</button>
          <button class="opt a" data-loc="Ambient" aria-pressed="false">Ambient</button>
        </div>
      </div>
      <div id="bayPick" hidden>
        <span class="lbl">Shelf row and bay</span>
        <div class="bays" id="bayGrid"></div>
      </div>
      <div>
        <label class="lbl" for="note">Note (optional)</label>
        <input type="text" class="plain" id="note" placeholder="e.g. tins, 12 trays" maxlength="80" autocomplete="off">
      </div>
      <button class="primary" id="save" disabled>Save location</button>
    </section>

    <section>
      <h2>Warehouse now <button class="link" id="refresh" style="margin-left:8px;text-transform:none;letter-spacing:0">Refresh</button></h2>
      <div class="panel map">
        <button class="zone w" data-zone="" id="waitZone" hidden><b>Not placed yet</b><span class="n" id="nWait">0</span><span class="codes" id="cWait"></span></button>
        <button class="zone c" data-zone="Chiller 1"><b>Chiller 1</b><span class="n" id="nC1">0</span><span class="codes" id="cC1"></span></button>
        <button class="zone c" data-zone="Chiller 2"><b>Chiller 2</b><span class="n" id="nC2">0</span><span class="codes" id="cC2"></span></button>
        <div class="zone a"><b>Ambient warehouse</b><span class="n" id="nAMB">0</span></div>
        <div class="bays mapbays" id="mapGrid"></div>
        <div id="zoneList" hidden>
          <h2 id="zoneTitle" style="margin-top:8px"></h2>
          <ul class="list" id="zoneItems"></ul>
        </div>
      </div>
    </section>

    <section>
      <h2>Recent moves</h2>
      <div class="panel"><ul class="list" id="log"><li class="empty">Loading…</li></ul></div>
    </section>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var ROWS = 4, BAYS = 5;
  var store = {
    get: function (k) { try { return localStorage.getItem('df_' + k) || ''; } catch (e) { return ''; } },
    set: function (k, v) { try { localStorage.setItem('df_' + k, v); } catch (e) {} }
  };
  var pin = store.get('pin'), myName = store.get('name');
  var units = new Map(), moves = [], loaded = false, busy = false;
  var sel = { kind: 'Dolly', loc: null, row: null, bay: null };
  var mapSel = null;

  // ===== Paste your Apps Script web app link (ending in /exec) between the quotes =====
  var API_URL = 'https://script.google.com/macros/s/AKfycbwNWLHzmF7trcHyPa9sUwDdcmV14wrA4p_irLJdMkBnzoIxwWAkRqu-E9myzwWfSqZU/exec';

  // Talk to the Google Sheet through the Apps Script link
  function call(fn) {
    var a = Array.prototype.slice.call(arguments, 1);
    var body = { action: fn };
    if (fn === 'getState') body.pin = a[0];
    if (fn === 'saveUnit') { body.pin = a[0]; body.data = a[1]; }
    if (fn === 'removeUnit') { body.pin = a[0]; body.code = a[1]; body.by = a[2]; }
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // plain text keeps Google happy across sites
      body: JSON.stringify(body),
      redirect: 'follow'
    }).then(function (r) {
      if (!r.ok) throw new Error('The warehouse sheet replied with error ' + r.status + '.');
      return r.json();
    }).then(function (res) {
      if (!res.ok) throw new Error(res.error || 'Something went wrong.');
      return res.result;
    });
  }
  function isPinErr(e) { return /PIN/.test(String(e && e.message || e)); }
  function clean(s) { return String(s).toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 24); }
  function where(u) {
    if (!u.loc) return 'Not placed yet';
    return u.loc === 'Ambient' ? 'Ambient · Row ' + u.row + ' · Bay ' + u.bay : u.loc;
  }
  function ago(t) {
    if (!t) return '';
    var s = Math.round((Date.now() - t) / 1000);
    if (s < 60) return 'just now';
    var m = Math.round(s / 60); if (m < 60) return m + ' min ago';
    var h = Math.round(m / 60); if (h < 24) return h + ' hr ago';
    return new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  }
  function toast(t) { var el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { el.hidden = true; }, 2800); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  // ---------- problems stay on screen ----------
  function showProblem(e) {
    var m = String((e && e.message) || e || 'Unknown error');
    $('setup').hidden = true; $('app').hidden = true;
    $('problemText').textContent = m;
    $('problemHelp').textContent = /not found|not defined|is not a function|Script function/i.test(m)
      ? 'The Code.gs part of the app is missing or not saved. In Apps Script, paste Code.gs in, save it, then deploy a new version.'
      : /authori|permission/i.test(m)
      ? 'The app needs permission to use the Sheet. In Apps Script, run any function once and allow access, then deploy a new version.'
      : /Failed to fetch|NetworkError|Load failed/i.test(m)
      ? 'Either there is no signal, or the Apps Script link is wrong or not set to "Anyone". Check your signal first, then try again.'
      : 'Check your signal, then try again. If it keeps happening, send this message to Steve.';
    $('problem').hidden = false;
  }
  $('retry').onclick = function () { location.reload(); };

  // ---------- setup ----------
  function showSetup(msg) {
    $('app').hidden = true; $('meBox').hidden = true; $('setup').hidden = false;
    $('name').value = myName;
    $('setupErr').hidden = !msg; $('setupErr').textContent = msg || '';
  }
  $('start').onclick = function () {
    var n = $('name').value.trim();
    if (!n) { $('setupErr').hidden = false; $('setupErr').textContent = 'Enter your first name.'; return; }
    myName = n; store.set('name', n);
    if (!$('pinWrap').hidden) { pin = $('pin').value.trim(); store.set('pin', pin); }
    $('start').disabled = true;
    load().then(function () { $('start').disabled = false; });
  };
  $('changeName').onclick = function () { showSetup(); };

  // ---------- grids ----------
  function buildGrid(box, onPick, isMap) {
    box.appendChild(el('span'));
    for (var b = 1; b <= BAYS; b++) box.appendChild(el('span', 'ch', 'Bay ' + b));
    for (var r = 1; r <= ROWS; r++) {
      box.appendChild(el('span', 'rh', 'Row ' + r));
      for (var y = 1; y <= BAYS; y++) (function (r, y) {
        var btn = el('button', 'bay');
        btn.dataset.row = r; btn.dataset.bay = y;
        btn.setAttribute('aria-label', 'Row ' + r + ', Bay ' + y);
        if (!isMap) { btn.textContent = r + '·' + y; btn.setAttribute('aria-pressed', 'false'); }
        btn.onclick = function () { onPick(r, y); };
        box.appendChild(btn);
      })(r, y);
    }
  }
  buildGrid($('bayGrid'), function (r, y) { sel.row = r; sel.bay = y; syncForm(); });
  buildGrid($('mapGrid'), function (r, y) {
    mapSel = (mapSel && mapSel.loc === 'Ambient' && mapSel.row === r && mapSel.bay === y) ? null : { loc: 'Ambient', row: r, bay: y };
    renderMap();
  }, true);
  document.querySelectorAll('[data-zone]').forEach(function (z) {
    z.onclick = function () { var l = z.dataset.zone; mapSel = (mapSel && mapSel.loc === l) ? null : { loc: l }; renderMap(); };
  });

  $('kindSeg').onclick = function (e) { var k = e.target.closest('[data-kind]'); if (k) { sel.kind = k.dataset.kind; syncForm(); } };
  $('locSeg').onclick = function (e) { var l = e.target.closest('[data-loc]'); if (l) { sel.loc = l.dataset.loc; if (sel.loc !== 'Ambient') sel.row = sel.bay = null; syncForm(); } };

  function syncForm() {
    document.querySelectorAll('[data-kind]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.kind === sel.kind); });
    document.querySelectorAll('[data-loc]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.loc === sel.loc); });
    $('bayPick').hidden = sel.loc !== 'Ambient';
    $('bayGrid').querySelectorAll('.bay').forEach(function (b) { b.setAttribute('aria-pressed', +b.dataset.row === sel.row && +b.dataset.bay === sel.bay); });
    $('save').disabled = busy || !(clean($('code').value) && sel.loc && (sel.loc !== 'Ambient' || sel.row));
    $('save').textContent = busy ? 'Saving…' : 'Save location';
  }

  // ---------- lookup ----------
  function renderResult() {
    var code = clean($('code').value), res = $('result'), form = $('formPanel');
    if (!code) { res.className = 'msg'; res.textContent = 'Type a code to see where it is.'; form.hidden = true; return; }
    var u = units.get(code);
    if (u && u.loc) {
      res.className = 'found'; res.innerHTML = '';
      var w = el('div', 'where'), tag = el('div', 'tag'), body = el('div');
      tag.style.background = u.loc === 'Ambient' ? 'var(--amb)' : 'var(--cold)';
      var top = el('div', 'sub'); top.appendChild(el('span', 'code', code)); top.appendChild(el('span', 'kind', u.kind));
      body.appendChild(top); body.appendChild(el('div', 'big', where(u)));
      body.appendChild(el('div', 'sub', 'Logged ' + ago(u.at) + (u.by ? ' by ' + u.by : '') + (u.note ? ' · ' + u.note : '')));
      w.appendChild(tag); w.appendChild(body); res.appendChild(w);
      var acts = el('div', 'row');
      var mv = el('button', 'ghost', "It's been moved"); mv.onclick = function () { openForm(u, 'Move it'); form.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
      var out = el('button', 'ghost danger', 'Gone out / used');
      acts.appendChild(mv); acts.appendChild(out); res.appendChild(acts);
      var conf = el('div', 'row'); conf.hidden = true;
      var yes = el('button', 'ghost danger', 'Yes, remove ' + code), no = el('button', 'ghost', 'Keep it');
      conf.appendChild(yes); conf.appendChild(no); res.appendChild(conf);
      out.onclick = function () { conf.hidden = false; };
      no.onclick = function () { conf.hidden = true; };
      yes.onclick = function () { yes.disabled = true; removeUnit(code); };
      if (form.dataset.for !== code) form.hidden = true;
    } else if (u) {
      res.className = 'msg';
      res.textContent = code + ' has been created but not placed yet. Pick where it is below.';
      openForm(u, 'Place it');
    } else {
      res.className = 'msg';
      res.textContent = loaded ? code + " isn't logged yet. Pick where it is below." : 'Loading locations…';
      if (loaded) openForm(null, 'Place it');
    }
  }
  function openForm(u, heading) {
    var form = $('formPanel'), code = clean($('code').value);
    if (form.hidden || form.dataset.for !== code) {
      sel = { kind: u ? u.kind : sel.kind, loc: null, row: null, bay: null };
      $('note').value = (u && u.note) || '';
    }
    form.dataset.for = code; $('formh').textContent = heading; form.hidden = false; syncForm();
  }
  var typing;
  $('code').addEventListener('input', function () { clearTimeout(typing); typing = setTimeout(renderResult, 150); syncForm(); });

  // ---------- server ----------
  function apply(state) {
    units = new Map(state.units.map(function (u) { return [u.code, u]; }));
    moves = state.moves; loaded = true;
    renderMap(); renderLog(); renderResult(); syncForm();
  }
  function load() {
    return call('getState', pin).then(function (s) {
      $('setup').hidden = true; $('app').hidden = false; $('meBox').hidden = false; $('meName').textContent = myName;
      apply(s);
    }).catch(function (e) {
      if (isPinErr(e)) { $('pinWrap').hidden = false; showSetup(pin ? 'That PIN is wrong. Check with a member of staff.' : ''); }
      else if (!$('app').hidden) toast("Couldn't refresh. Check your signal and try again.");
      else showProblem(e);
    });
  }
  function save() {
    var code = clean($('code').value); if (!code) return;
    busy = true; syncForm();
    var d = { code: code, kind: sel.kind, loc: sel.loc, row: sel.row, bay: sel.bay, note: $('note').value.trim(), by: myName };
    call('saveUnit', pin, d).then(function (s) {
      busy = false;
      toast(code + ' saved: ' + where(d));
      $('formPanel').hidden = true; $('formPanel').dataset.for = '';
      $('code').value = ''; apply(s); $('code').focus();
    }).catch(function (e) {
      busy = false; syncForm();
      toast(isPinErr(e) ? 'The PIN has changed. Reload the page.' : "Couldn't save. Check your signal and try again.");
    });
  }
  $('save').onclick = save;
  function removeUnit(code) {
    call('removeUnit', pin, code, myName).then(function (s) {
      toast(code + ' removed'); $('code').value = ''; apply(s);
    }).catch(function () { toast("Couldn't remove it. Try again."); renderResult(); });
  }
  $('refresh').onclick = function () { load().then(function () { toast('Up to date'); }); };

  // ---------- map + log ----------
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function chips(id, list) {
    var MAX = 12, box = $(id); box.innerHTML = '';
    list.slice(0, MAX).forEach(function (u) { box.appendChild(el('span', 'chip', u.code)); });
    if (list.length > MAX) box.appendChild(el('span', 'chip more', '+' + (list.length - MAX) + ' more'));
  }
  function renderMap() {
    var all = Array.from(units.values());
    var count = function (f) { return all.filter(f).length; };
    var waiting = count(function (u) { return !u.loc; });
    $('nWait').textContent = waiting; $('waitZone').hidden = waiting === 0;
    $('nC1').textContent = count(function (u) { return u.loc === 'Chiller 1'; });
    $('nC2').textContent = count(function (u) { return u.loc === 'Chiller 2'; });
    var byCode = function (a, b) { return a.code.localeCompare(b.code); };
    chips('cWait', all.filter(function (u) { return !u.loc; }).sort(byCode));
    chips('cC1', all.filter(function (u) { return u.loc === 'Chiller 1'; }).sort(byCode));
    chips('cC2', all.filter(function (u) { return u.loc === 'Chiller 2'; }).sort(byCode));
    $('nAMB').textContent = count(function (u) { return u.loc === 'Ambient'; });
    document.querySelectorAll('[data-zone]').forEach(function (z) { z.classList.toggle('sel', !!mapSel && mapSel.loc === z.dataset.zone); });
    $('mapGrid').querySelectorAll('.bay').forEach(function (b) {
      var r = +b.dataset.row, y = +b.dataset.bay;
      var n = count(function (u) { return u.loc === 'Ambient' && u.row === r && u.bay === y; });
      b.classList.toggle('has', n > 0);
      b.classList.toggle('sel', !!mapSel && mapSel.loc === 'Ambient' && mapSel.row === r && mapSel.bay === y);
      var inBay = all.filter(function (u) { return u.loc === 'Ambient' && u.row === r && u.bay === y; }).map(function (u) { return u.code; }).sort();
      b.innerHTML = '<small>' + r + '·' + y + '</small>' +
        inBay.slice(0, 4).map(function (c) { return '<span class="bc">' + esc(c) + '</span>'; }).join('') +
        (inBay.length > 4 ? '<span class="bm">+' + (inBay.length - 4) + ' more</span>' : '');
    });
    var box = $('zoneList');
    if (!mapSel) { box.hidden = true; return; }
    var items = all.filter(function (u) {
      return (u.loc || '') === mapSel.loc && (mapSel.loc !== 'Ambient' || (u.row === mapSel.row && u.bay === mapSel.bay));
    }).sort(function (a, b) { return a.code.localeCompare(b.code); });
    var title = mapSel.loc === 'Ambient' ? 'Row ' + mapSel.row + ' · Bay ' + mapSel.bay : (mapSel.loc || 'Not placed yet');
    $('zoneTitle').textContent = title + ' (' + items.length + ')';
    var ul = $('zoneItems'); ul.innerHTML = '';
    if (!items.length) ul.appendChild(el('li', 'empty', 'Nothing logged here.'));
    items.forEach(function (u) {
      var li = el('li'), left = el('span');
      var btn = el('button', 'link code', u.code); btn.style.fontSize = '1rem';
      btn.onclick = function () { $('code').value = u.code; renderResult(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      left.appendChild(btn); left.appendChild(el('span', 'kind', u.kind));
      li.appendChild(left); li.appendChild(el('span', 'meta', ago(u.at))); ul.appendChild(li);
    });
    box.hidden = false;
  }
  function renderLog() {
    var ul = $('log'); ul.innerHTML = '';
    if (!moves.length) { ul.appendChild(el('li', 'empty', 'Nothing logged yet. Type a code above and save its location to start.')); return; }
    moves.forEach(function (m) {
      var li = el('li'), mv = el('span', 'mv');
      mv.appendChild(el('span', 'code', m.code));
      mv.appendChild(document.createTextNode(m.from ? '  ' + m.from + ' → ' + m.to : '  placed in ' + m.to));
      li.appendChild(mv); li.appendChild(el('span', 'meta', ago(m.at) + (m.by ? ' · ' + m.by : '')));
      ul.appendChild(li);
    });
  }

  // ---------- start ----------
  if (!/\/exec$/.test(API_URL)) { showProblem(new Error('The link to the warehouse sheet hasn\'t been set up yet. Put your Apps Script /exec link into API_URL near the bottom of index.html.')); return; }
  call('needsPin').then(function (need) {
    $('pinWrap').hidden = !need;
    if (!myName || (need && !pin)) showSetup(); else load();
  }).catch(showProblem);

  // keep everyone roughly in step: refresh every 30 seconds and when the phone is unlocked
  setInterval(function () { if (!document.hidden && !$('app').hidden && !busy) call('getState', pin).then(apply).catch(function () {}); }, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !$('app').hidden) call('getState', pin).then(apply).catch(function () {}); });
})();
</script>
</body>
</html>
